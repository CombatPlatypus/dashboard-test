<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teste visual do Parcel Sweeper — dados fictícios</title>
    <link rel="stylesheet" href="../../css/font-face.css">
    <link rel="stylesheet" href="../../css/reports-style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 24px; background: #101010; color: #e4e6eb; font: 14px "Open Sans", sans-serif; }
        header { margin-bottom: 20px; }
        button { margin: 0 8px 8px 0; padding: 10px 18px; color: #e4e6eb; background: #242424; border: 1px solid #666; cursor: pointer; }
        .distribution { display: grid; grid-template-columns: minmax(300px, 500px) minmax(340px, 1fr); gap: 15px; }
        .operator-card { padding: 25px; border: 1px solid #666; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        caption, th { padding: 12px; background: #252525; font-weight: 600; }
        td, th { border: 1px solid #666; padding: 10px; text-align: center; }
        tr:nth-child(even) { background: #1b1b1b; }
        #parcelPreview { display: flex; flex-direction: column; gap: 20px; padding: 20px; border: 1px solid #666; }
        #exportPreview { display: block; max-width: 100%; margin-top: 20px; }
        #exportStatus { min-height: 24px; }
        @media (max-width: 850px) { .distribution { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <h1>Prévia técnica — dados fictícios</h1>
        <button data-coverage="0">0%</button>
        <button data-coverage="0.01">1%</button>
        <button data-coverage="0.6666666666666666">66,7%</button>
        <button data-coverage="1">100%</button>
        <button id="generateExport">Gerar imagem</button>
        <button id="resetParcelTest">Limpar dados fictícios</button>
        <p id="exportStatus" role="status"></p>
    </header>
    <main id="reports">
        <section id="parcel" class="is-active">
            <div id="parcelPreview">
                <div class="distribution">
                    <div class="doughnut-chart">
                        <h3>Cobertura da Varredura</h3>
                        <div><canvas id="parcelCoverageChart" role="img" aria-label="Cobertura da varredura entre pacotes escaneados e não escaneados"></canvas></div>
                        <div>
                            <p>Escaneados <span id="parcelCoverageScanned">—</span></p>
                            <p>Não Escaneados <span id="parcelCoverageUnscanned">—</span></p>
                        </div>
                    </div>
                    <div class="operator-card">
                        <table>
                            <caption>Distribuição por Operador</caption>
                            <thead><tr><th>Operador</th><th>Quantidade</th><th>Percentual</th><th>Volumoso?</th></tr></thead>
                            <tbody id="parcelOperatorDistributionBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="vertical-bars-chart">
                    <div class="chart-title"><h4>Distribuição por Aging</h4></div>
                    <div id="parcelAgingChartContainer">
                        <div><canvas id="parcelAgingChart" role="img" aria-label="Quantidade de pacotes escaneados por faixa de aging"></canvas></div>
                    </div>
                </div>
                <div id="parcelStatusCharts">
                    <div class="horizontal-bars-chart">
                        <div class="chart-title"><h4>Distribuição por Scanned Status</h4></div>
                        <div id="parcelScannedStatusChartContainer" class="parcel-horizontal-chart-canvas">
                            <canvas id="parcelScannedStatusChart" role="img" aria-label="Quantidade de pacotes por Scanned Status"></canvas>
                        </div>
                    </div>
                    <div class="horizontal-bars-chart">
                        <div class="chart-title"><h4>Distribuição por Final Status</h4></div>
                        <div id="parcelFinalStatusChartContainer" class="parcel-horizontal-chart-canvas">
                            <canvas id="parcelFinalStatusChart" role="img" aria-label="Quantidade de pacotes por Final Status"></canvas>
                        </div>
                    </div>
                </div>
                <div class="vertical-bars-chart">
                    <div class="chart-title"><h4>Distribuição por Next Step Action</h4></div>
                    <div id="parcelNextStepActionChartContainer">
                        <div><canvas id="parcelNextStepActionChart" role="img" aria-label="Quantidade de pacotes por Next Step Action"></canvas></div>
                    </div>
                </div>
            </div>
            <div hidden>
                <span id="parcelTotalScanned"></span><span id="parcelBacklogTotal"></span>
                <span id="parcelExceptionTotal"></span><span id="parcelUnscannedTotal"></span>
                <span id="parcelMissortedTotal"></span>
                <div id="parcelPackageFilter"></div>
                <table><tbody id="parcelCommonPackagesBody"></tbody></table>
                <table><tbody id="parcelBulkyPackagesBody"></tbody></table>
            </div>
        </section>
    </main>
    <img id="exportPreview" alt="Imagem exportada do relatório de teste" hidden>
    <script src="../../js/libraries/chart.umd.min.js"></script>
    <script src="../../js/libraries/html2canvas.min.js"></script>
    <script type="module">
        import { initializeParcelCharts } from "../../js/reports/parcel-sweeper/charts.js";
        import { initializeParcelView } from "../../js/reports/parcel-sweeper/view.js?preview=coverage-percentages";
        import { replaceParcelRows, resetParcelReport } from "../../js/reports/parcel-sweeper/state.js";
        import { createReportImageBlob } from "../../js/reports/export.js";

        initializeParcelCharts();
        initializeParcelView();
        function setCoverage(percentage) {
            const scanned = Math.round(300 * percentage);
            replaceParcelRows(Array.from({ length: 300 }, (_, index) => ({
                trackingNumber: `BRTEST${index}`,
                scannedStatus: index < scanned ? "Scanned" : "-",
                operator: index < scanned ? `[Ops${100 + index % 3}]OPERADOR TESTE ${index % 3}` : "",
                countType: index < scanned ? "Backlog" : "Missing",
                agingTime: `${2 + index % 100}h`,
                finalStatus: ["LMHub_Received", "SOC_LHTransported", "Return_LMHub_Packed", "Return_LMHub_Received", "FMHub_LHTransported", "Delivered", "SOC_Received", "SOC_Packed", "LMHub_Packed", "-"][index % 20 < 10 ? 0 : index % 10],
                nextStepAction: index % 20 < 12 ? "Process for delivery" : ["-", "Put in EHA", "Process for return", "Return to SOC", "Process for liquidation"][index % 5],
            })), "dados-ficticios.csv");
        }
        document.querySelectorAll("[data-coverage]").forEach(button => {
            button.addEventListener("click", () => setCoverage(Number(button.dataset.coverage)));
        });
        setCoverage(2 / 3);
        document.getElementById("resetParcelTest").addEventListener("click", resetParcelReport);
        document.getElementById("generateExport").addEventListener("click", async () => {
            const status = document.getElementById("exportStatus");
            status.textContent = "Gerando imagem...";
            try {
                const blob = await createReportImageBlob(document.getElementById("parcelPreview"));
                const image = document.getElementById("exportPreview");
                if (image.dataset.blobUrl) URL.revokeObjectURL(image.dataset.blobUrl);
                image.dataset.blobUrl = URL.createObjectURL(blob);
                image.src = image.dataset.blobUrl;
                image.hidden = false;
                status.textContent = "Imagem PNG gerada com sucesso.";
            } catch (error) {
                status.textContent = `Falha na exportação: ${error.message}`;
            }
        });
    </script>
</body>
</html>
