<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ranking de recebedores — prévia com dados fictícios</title>
    <link rel="stylesheet" href="../../css/font-face.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 24px; background: #101010; color: #e4e6eb; font: 14px "Open Sans", sans-serif; letter-spacing: 1px; }
        h1 { font-size: 18px; font-weight: 600; }
        button { padding: 8px 16px; color: inherit; background: #242424; border: 1px solid #666; cursor: pointer; }
        #receipt { width: 100%; max-width: 1100px; margin-top: 20px; }
        .cards { display: flex; gap: 16px; margin-bottom: 20px; }
        .cards > div { flex: 1; padding: 20px; border: 1px solid #666; text-align: center; }
        .chart { border: 1px solid #666; }
        #receiptAlignedComparisonChartContainer { position: relative; margin: 0 20px; }
    </style>
</head>
<body>
    <h1>Ranking de recebedores — dados fictícios para teste visual</h1>
    <button id="toggleWidth">Alternar largura</button>
    <section id="receipt" class="is-active">
        <div id="receipt-charts" class="is-active">
            <div class="preview-style" id="receiptComparisonExportArea">
                <div class="cards">
                    <div><strong id="receiptComparisonTopReceiver"></strong><p>Maior Volume Recebido</p><span id="receiptComparisonTopVolume"></span></div>
                    <div><strong id="receiptComparisonTopRate"></strong><p id="receiptComparisonTopRateLabel"></p><span id="receiptComparisonTopRateDetails"></span></div>
                </div>
                <div class="chart">
                    <div id="receiptAlignedComparisonChartContainer">
                        <canvas id="receiptAlignedComparisonChart" role="img" aria-label="Ranking de recebedores por volume e participação nos erros"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="report-controls" hidden></div>
        <div hidden>
            <span id="receiptProgressReceived"></span><span id="receiptProgressExpected"></span>
            <span id="receiptProgressPercentage"></span><div id="receiptProgressBar"><div id="receiptProgressFill"></div></div>
        </div>
    </section>
    <script src="../../js/libraries/chart.umd.min.js"></script>
    <script src="../../js/charts/defaults.js"></script>
    <script type="module">
        import { initializeReceiptCharts } from "../../js/reports/receipt/charts.js";
        import { replaceReceiptOperators, updateReceiptGeneralField } from "../../js/reports/receipt/state.js";
        replaceReceiptOperators([
            { receiver: "Mariane", packagesReceived: 1949, errorQuantity: 10, labeler: "Lucas" },
            { receiver: "Tamires", packagesReceived: 1539, errorQuantity: 5 },
            { receiver: "Willian", packagesReceived: 1244, errorQuantity: 8 },
            { receiver: "Joao", packagesReceived: 1105, errorQuantity: 2 },
            { receiver: "Antonio", packagesReceived: 225, errorQuantity: 8 },
        ]);
        updateReceiptGeneralField("useTotalErrorParticipation", true);
        initializeReceiptCharts(document.getElementById("receipt"));
        document.getElementById("toggleWidth").addEventListener("click", () => {
            const panel = document.getElementById("receipt");
            panel.style.maxWidth = panel.style.maxWidth === "480px" ? "1100px" : "480px";
        });
    </script>
</body>
</html>
